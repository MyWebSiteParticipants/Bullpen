# CI: the gate every pull request must pass, and a nightly re-check of main.
#
# deploy.yml runs only AFTER a merge to main. This workflow runs BEFORE the
# merge — on every pull request — so a change that fails typecheck, tests or
# the build is red on the PR, where review can stop it. (Make it required:
# Settings -> Rules -> Rulesets -> require the "CI / app" and "CI / relay" checks.)
#
# The schedule catches failures that arrive WITHOUT a push: a dependency that
# moved under a ^ range, a date-sensitive test, a new Node patch release.
#
# Pull requests from forks run here with a read-only GITHUB_TOKEN and no
# secrets. This workflow needs neither, on purpose.

name: CI

on:
  pull_request:          # every PR, whatever branch it targets (main or dev)
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC daily (off the top of the hour, when runners are busiest)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR; a new push to the same PR cancels the stale run.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # test.mjs uses a mock upstream and needs no dependencies (not even wrangler).
      - run: node test.mjs
