name: Bug report
description: Report a bug to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-i-did
    attributes:
      label: What I did
    validations:
      required: true
  - type: textarea
    id: what-i-expected
    attributes:
      label: What I expected
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: The footer's build stamp
    validations:
      required: true